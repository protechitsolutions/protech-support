# Builds ProTech Support for Mac (Apple-chip and Intel) on GitHub's own Macs.
#
# This is the macOS part of the official RustDesk 1.5.3 workflow (rustdesk/rustdesk .github/workflows/flutter-build.yml and bridge.yml),
# with the same pinned actions and tool versions, reduced to what the Mac app needs, building from ProTech's source (see
# scripts/assemble-source.sh). Differences from upstream: no hardware codecs (ProTech's patch 0001 drops ffmpeg), no signing or
# notarisation (the app is signed "ad hoc" by scripts/package-mac.sh), no release publishing, no update metadata.
#
# Run it by hand: Actions > "Build ProTech Support for Mac" > Run workflow. The result is the artifact "ProTech-Support-mac-<arch>"
# (a zip with the generic app). ProTech then adds its signed settings file with scripts/package-mac.sh on a Mac.
name: Build ProTech Support for Mac

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: "1.5.3"
  MAC_RUST_VERSION: "1.81"                # upstream: 1.81 is required for macOS (the cidre crate)
  FLUTTER_VERSION: "3.24.5"               # Intel Macs
  FLUTTER_MACOS_ARM_VERSION: "3.44.9"     # Apple-chip Macs: 3.24.5's engine crashes there (rustdesk issue 16817)
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear"           # no binary cache: the first builds compile the libraries (about 20 minutes)

jobs:
  # ---------------------------------------------------------------------------------------------------------------------------
  # flutter_rust_bridge: generated Rust/Dart glue, shared by both Mac builds (Flutter 3.22.3 for Intel, 3.44.8 for Apple chip)
  # ---------------------------------------------------------------------------------------------------------------------------
  bridge:
    name: bridge (Flutter ${{ matrix.job.flutter-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { flutter-version: "3.22.3", artifact-name: "bridge-artifact" }
          - { flutter-version: "3.44.8", artifact-name: "bridge-artifact-flutter-3.44" }
    defaults:
      run:
        working-directory: src
    env:
      CARGO_EXPAND_VERSION: "1.0.95"
      FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
      RUST_VERSION: "1.75"
    steps:
      - name: Checkout ProTech's build files
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: ci
          persist-credentials: false

      - name: Assemble the source (upstream + ProTech patches)
        working-directory: ${{ github.workspace }}
        run: ci/scripts/assemble-source.sh "$GITHUB_WORKSPACE/src" --mac

      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-ubuntu-22.04
          workspaces: src

      - name: Cache Bridge
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: /tmp/flutter_rust_bridge
          key: bridge-${{ matrix.job.flutter-version }}

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.flutter-version }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          if [[ "${{ matrix.job.flutter-version }}" == "3.22.3" ]]; then
            # Flutter 3.22.3: extended_text 14 needs a newer Dart, so downgrade for resolution (as upstream does)
            sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          else
            # Flutter 3.44 (Apple-chip Macs): the same source/pubspec state the Mac build uses
            bash .github/patches/apply_flutter_3.44_source_patches.sh
          fi
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.job.artifact-name }}
          path: |
            src/src/bridge_generated.rs
            src/src/bridge_generated.io.rs
            src/flutter/lib/generated_bridge.dart
            src/flutter/lib/generated_bridge.freezed.dart
            src/flutter/macos/Runner/bridge_generated.h
            src/flutter/ios/Runner/bridge_generated.h
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------------------------------------
  # The Mac app itself
  # ---------------------------------------------------------------------------------------------------------------------------
  mac:
    name: Mac (${{ matrix.job.arch }})
    needs: [bridge]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { arch: x86_64,  package-arch: x86_64, os: macos-15-intel, target: x86_64-apple-darwin,  vcpkg-triplet: x64-osx,   extra-build-args: "",                 bridge: bridge-artifact }
          - { arch: aarch64, package-arch: arm64,  os: macos-15,       target: aarch64-apple-darwin, vcpkg-triplet: arm64-osx, extra-build-args: "--screencapturekit", bridge: bridge-artifact-flutter-3.44 }
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout ProTech's build files
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: ci
          persist-credentials: false

      - name: Assemble the source (upstream + ProTech patches)
        working-directory: ${{ github.workspace }}
        run: ci/scripts/assemble-source.sh "$GITHUB_WORKSPACE/src" --mac

      - name: ProTech icons
        working-directory: ${{ github.workspace }}
        run: ci/scripts/brand-mac.sh "$GITHUB_WORKSPACE/src"

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Install NASM
        run: |
          # NASM 2.16.x from the official release: `brew install nasm` gives 3.x, which aom and other libraries cannot use
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_MACOS_ARM_VERSION || env.FLUTTER_VERSION }}

      - name: Keep CocoaPods for Flutter 3.44 (Apple chip)
        if: ${{ matrix.job.arch == 'aarch64' }}
        run: flutter config --no-enable-swift-package-manager

      - name: Patch flutter
        if: ${{ matrix.job.arch == 'x86_64' }}
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
            git apply ${{ github.workspace }}/src/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Patch RustDesk sources for Flutter 3.44 (Apple chip)
        if: ${{ matrix.job.arch == 'aarch64' }}
        shell: bash
        run: |
          brew install gnu-sed
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}
          workspaces: src

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.job.bridge }}
          path: src

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Show version information (Rust, cargo, Clang)
        shell: bash
        run: |
          clang --version || true
          rustup -V
          rustup toolchain list
          rustup default
          cargo -V
          rustc -V
          flutter --version

      - name: Build ProTech Support
        run: |
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
            echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
          fi
          # upstream also passes --hwcodec; ProTech's patch 0001 removes the ffmpeg libraries it needs
          ./build.py --flutter --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      - name: Package (rename, ad-hoc signature, zip)
        working-directory: ${{ github.workspace }}
        run: |
          ci/scripts/package-mac.sh \
            "src/flutter/build/macos/Build/Products/Release/RustDesk.app" \
            "$GITHUB_WORKSPACE/out" \
            --arch ${{ matrix.job.package-arch }}
          ls -la out

      - name: Upload the Mac app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ProTech-Support-mac-${{ matrix.job.package-arch }}
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Upload library build logs (only when something failed)
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vcpkg-logs-${{ matrix.job.package-arch }}
          path: vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore
          retention-days: 7
